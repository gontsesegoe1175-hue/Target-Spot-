<!DOCTYPE html>
<html lang="en">
<head>
<style>
  .card {
    position: relative;
    width: 300px;
    height: 200px;
    overflow: hidden;
    border-radius: 12px;
    cursor: pointer;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  /* Blurred background layer */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: inherit;
    background-size: cover;
    background-position: center;
    filter: blur(0px);
    transition: filter 0.4s ease;
    z-index: 0;
  }

  .card:hover::before {
    filter: blur(12px);
  }

  .card:hover img {
    transform: scale(1.05);
  }

  /* Info box that appears */
  .info {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 1;
    text-align: center;
    padding: 16px;
  }

  .card:hover .info {
    opacity: 1;
  }

  .info h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  .info p {
    margin: 8px 0 0;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card" style="background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836')">
  <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" alt="Product">
  <div class="info">
    <h3>Delicious Kettle</h3>
    <p>Stainless steel • 1.7L • Boils in 3 min</p>
  </div>
</div>

</body>
</html>
